[package]
name = "personal-finance-console"
version = "0.1.0"
description = "Personal Finance Console local desktop foundation"
authors = ["Codex"]
edition = "2021"
rust-version = "1.90"

[features]
v4-acceptance = []

[lib]
name = "personal_finance_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
