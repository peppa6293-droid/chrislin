<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的海岸骑行 · Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #17343b;
    --cream: #fff3da;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #17343b;
  }

  body {
    display: grid;
    place-items: center;
    font-family: Georgia, "Times New Roman", serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #efc49b;
  }

  stage { display: block; }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .brand {
    position: absolute;
    top: clamp(18px, 3.4vw, 46px);
    left: clamp(20px, 4vw, 56px);
    color: #fff6e2;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(12, 40, 48, .55), 0 3px 16px rgba(12, 40, 48, .34);
    animation: brand-in 1.6s cubic-bezier(.2, .8, .2, 1) both;
  }

  .brand__eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    font-size: clamp(8px, .78vw, 11px);
    font-weight: 700;
    letter-spacing: .34em;
    text-transform: uppercase;
    opacity: .8;
  }

  .brand__eyebrow::before {
    content: "";
    width: 30px;
    height: 1px;
    background: currentColor;
    opacity: .7;
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(26px, 3.3vw, 52px);
    font-weight: 400;
    line-height: .95;
    letter-spacing: -.035em;
  }

  .brand h1 em {
    display: block;
    font-size: .54em;
    font-style: italic;
    letter-spacing: .01em;
    opacity: .82;
    margin-top: .32em;
  }

  .stamp {
    position: absolute;
    right: clamp(18px, 4vw, 56px);
    bottom: clamp(18px, 4vw, 52px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    color: rgba(22, 63, 73, .82);
    pointer-events: none;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    font-size: clamp(8px, .72vw, 10px);
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(255, 246, 224, .3);
  }

  .stamp .rule {
    width: 74px;
    height: 1px;
    background: currentColor;
    opacity: .5;
  }

  .motion-toggle {
    position: absolute;
    right: clamp(18px, 4vw, 56px);
    top: clamp(18px, 3.4vw, 46px);
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 243, 218, .42);
    border-radius: 50%;
    background: rgba(23, 52, 59, .16);
    color: var(--cream);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .25s ease, transform .25s ease;
  }

  .motion-toggle:hover { background: rgba(23, 52, 59, .34); transform: scale(1.05); }
  .motion-toggle:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  .motion-toggle svg { width: 15px; height: 15px; fill: currentColor; }
  .motion-toggle .play-icon { display: none; }
  .motion-toggle.is-paused .pause-icon { display: none; }
  .motion-toggle.is-paused .play-icon { display: block; }

  @keyframes brand-in {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ambient, non-essential SVG motion */
  .cloud--a { animation: cloud-a 46s ease-in-out infinite alternate; }
  .cloud--b { animation: cloud-b 58s ease-in-out infinite alternate; }
  .cloud--c { animation: cloud-c 51s ease-in-out infinite alternate; }
  @keyframes cloud-a { from { transform: translateX(-12px); } to { transform: translateX(34px); } }
  @keyframes cloud-b { from { transform: translateX(24px); } to { transform: translateX(-30px); } }
  @keyframes cloud-c { from { transform: translateX(-18px); } to { transform: translateX(26px); } }

  .ray-group { transform-origin: 916px 188px; animation: turn 100s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .sun-halo { animation: sun-breathe 9s ease-in-out infinite alternate; transform-origin: 916px 188px; }
  @keyframes sun-breathe { from { opacity: .42; transform: scale(.94); } to { opacity: .7; transform: scale(1.06); } }

  .gull { animation: gull-float 6s ease-in-out infinite; }
  .gull--2 { animation-delay: -2.3s; animation-duration: 7.4s; }
  .gull--3 { animation-delay: -4.1s; animation-duration: 8.2s; }
  @keyframes gull-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .wave-line { stroke-dasharray: 24 18; animation: wave-drift 5.5s linear infinite; }
  .wave-line--slow { animation-duration: 9s; animation-direction: reverse; opacity: .45; }
  @keyframes wave-drift { to { stroke-dashoffset: -84; } }

  .road-dashes { stroke-dasharray: 76 132; animation: road-run 1.35s linear infinite; }
  .road-dashes--far { stroke-dasharray: 36 96; animation: road-run 2.2s linear infinite; }
  @keyframes road-run { to { stroke-dashoffset: -208; } }

  .wind-line { stroke-dasharray: 70 230; animation: wind-pass 2.4s linear infinite; }
  .wind-line--2 { animation-delay: -1.1s; animation-duration: 3.3s; }
  .wind-line--3 { animation-delay: -2s; animation-duration: 2.9s; }
  @keyframes wind-pass { from { stroke-dashoffset: 260; } to { stroke-dashoffset: -320; } }

  .grass-a { transform-origin: 56px 792px; animation: sway-a 4.8s ease-in-out infinite alternate; }
  .grass-b { transform-origin: 1156px 796px; animation: sway-b 5.7s ease-in-out infinite alternate; }
  @keyframes sway-a { from { transform: rotate(-1.4deg); } to { transform: rotate(2deg); } }
  @keyframes sway-b { from { transform: rotate(1.2deg); } to { transform: rotate(-1.8deg); } }

  .dust { animation: dust-puff 2.2s ease-out infinite; }
  .dust--2 { animation-delay: -.7s; }
  .dust--3 { animation-delay: -1.4s; }
  @keyframes dust-puff {
    0% { opacity: 0; transform: translate(0, 0) scale(.35); }
    22% { opacity: .38; }
    100% { opacity: 0; transform: translate(-58px, 8px) scale(1.3); }
  }

  .sea-plane { animation: bob 8s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.4deg); } 50% { transform: translateY(4px) rotate(.5deg); } }

  .blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6.5s infinite;
  }
  @keyframes blink {
    0%, 41%, 45%, 100% { transform: scaleY(1); }
    43% { transform: scaleY(.08); }
  }

  .stage.is-paused * {
    animation-play-state: paused !important;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }

  @media (max-width: 700px) {
    .brand h1 { font-size: clamp(23px, 6vw, 32px); }
    .brand__eyebrow { letter-spacing: .24em; }
    .stamp { display: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只戴红围巾的鹈鹕，在日落海岸边骑着一辆珊瑚色自行车">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d4659"/>
        <stop offset=".36" stop-color="#5e929c"/>
        <stop offset=".66" stop-color="#d8ae98"/>
        <stop offset=".86" stop-color="#f7d4a6"/>
        <stop offset="1" stop-color="#f9e6c6"/>
      </linearGradient>
      <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9ab"/>
        <stop offset=".55" stop-color="#ffc87a" stop-opacity=".7"/>
        <stop offset="1" stop-color="#ffc87a" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6f9fa4"/>
        <stop offset=".5" stop-color="#5b8f97"/>
        <stop offset="1" stop-color="#4b7d87"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d8a77e"/>
        <stop offset=".55" stop-color="#e8bd92"/>
        <stop offset="1" stop-color="#d6a077"/>
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd27a"/>
        <stop offset=".52" stop-color="#f6ad48"/>
        <stop offset="1" stop-color="#e98d35"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffdda0"/>
        <stop offset=".62" stop-color="#f7bf63"/>
        <stop offset="1" stop-color="#eda148"/>
      </linearGradient>
      <linearGradient id="feather" x1=".2" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#fffdf4"/>
        <stop offset=".62" stop-color="#fff5df"/>
        <stop offset="1" stop-color="#ead8ba"/>
      </linearGradient>
      <linearGradient id="wing" x1=".1" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#fffaf0"/>
        <stop offset=".66" stop-color="#f8edd8"/>
        <stop offset="1" stop-color="#dec9a8"/>
      </linearGradient>
      <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ef6a50"/>
        <stop offset=".55" stop-color="#df523d"/>
        <stop offset="1" stop-color="#c53f30"/>
      </linearGradient>
      <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#b6322c"/>
        <stop offset=".55" stop-color="#df4e3f"/>
        <stop offset="1" stop-color="#ef7359"/>
      </linearGradient>
      <radialGradient id="vignette" cx=".5" cy=".46" r=".72">
        <stop offset=".55" stop-color="#123039" stop-opacity="0"/>
        <stop offset="1" stop-color="#0c2028" stop-opacity=".38"/>
      </radialGradient>
      <radialGradient id="groundShadow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#26383a" stop-opacity=".36"/>
        <stop offset=".68" stop-color="#26383a" stop-opacity=".15"/>
        <stop offset="1" stop-color="#26383a" stop-opacity="0"/>
      </radialGradient>
      <filter id="softBlur"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="tinyBlur"><feGaussianBlur stdDeviation="2.4"/></filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="8" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
        <feComponentTransfer in="mono" result="faint">
          <feFuncA type="linear" slope=".055"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
      </filter>
      <clipPath id="sceneClip"><rect width="1200" height="800"/></clipPath>
    </defs>

    <g clip-path="url(#sceneClip)">
      <!-- sky -->
      <rect width="1200" height="800" fill="url(#sky)"/>

      <!-- sun -->
      <g id="sun" transform="translate(58 -52)">
        <circle class="sun-halo" cx="916" cy="188" r="182" fill="url(#sunGlow)"/>
        <g class="ray-group" opacity=".17" fill="#ffe8b4">
          <path d="M916 188 L900 45 L932 45 Z"/>
          <path d="M916 188 L1020 60 L1046 78 Z"/>
          <path d="M916 188 L1084 132 L1092 160 Z"/>
          <path d="M916 188 L1058 268 L1038 288 Z"/>
          <path d="M916 188 L760 55 L772 32 Z"/>
          <path d="M916 188 L742 128 L748 100 Z"/>
          <path d="M916 188 L774 270 L794 292 Z"/>
        </g>
        <circle cx="916" cy="188" r="75" fill="#ffd989"/>
        <circle cx="916" cy="188" r="63" fill="#ffe7a6"/>
        <circle cx="898" cy="170" r="20" fill="#fff6cf" opacity=".6"/>
      </g>

      <!-- clouds -->
      <g fill="#fff4dc" opacity=".62">
        <g class="cloud cloud--a" transform="translate(120 152)">
          <path d="M0 38 C-2 20 11 8 29 8 C37 -8 59 -14 73 1 C87 0 98 9 100 22 C113 20 124 30 124 42 C124 54 113 61 100 61 L20 61 C7 61 0 50 0 38 Z"/>
          <path d="M0 38 C20 44 42 32 60 40 C80 48 105 40 124 42 L124 61 L20 61 C7 61 0 50 0 38 Z" fill="#eec7b2" opacity=".18"/>
        </g>
        <g class="cloud cloud--b" transform="translate(702 106) scale(.72)" opacity=".72">
          <path d="M0 38 C-2 20 11 8 29 8 C37 -8 59 -14 73 1 C87 0 98 9 100 22 C113 20 124 30 124 42 C124 54 113 61 100 61 L20 61 C7 61 0 50 0 38 Z"/>
          <path d="M0 38 C20 44 42 32 60 40 C80 48 105 40 124 42 L124 61 L20 61 C7 61 0 50 0 38 Z" fill="#eec7b2" opacity=".2"/>
        </g>
        <g class="cloud cloud--c" transform="translate(1010 288) scale(.48)" opacity=".34">
          <path d="M0 38 C-2 20 11 8 29 8 C37 -8 59 -14 73 1 C87 0 98 9 100 22 C113 20 124 30 124 42 C124 54 113 61 100 61 L20 61 C7 61 0 50 0 38 Z"/>
        </g>
        <g class="cloud cloud--b" transform="translate(436 238) scale(.38)" opacity=".32">
          <path d="M0 38 C-2 20 11 8 29 8 C37 -8 59 -14 73 1 C87 0 98 9 100 22 C113 20 124 30 124 42 C124 54 113 61 100 61 L20 61 C7 61 0 50 0 38 Z"/>
        </g>
      </g>

      <!-- gulls -->
      <g fill="none" stroke="#294b54" stroke-width="3.2" stroke-linecap="round" opacity=".62">
        <g class="gull" transform="translate(296 152)">
          <path d="M0 6 Q10 -3 20 6 Q30 -3 40 6"/>
        </g>
        <g class="gull gull--2" transform="translate(354 116) scale(.72)">
          <path d="M0 6 Q10 -3 20 6 Q30 -3 40 6"/>
        </g>
        <g class="gull gull--3" transform="translate(226 214) scale(.52)">
          <path d="M0 6 Q10 -3 20 6 Q30 -3 40 6"/>
        </g>
      </g>

      <!-- distant coast -->
      <path d="M0 492 C90 470 152 470 232 489 C304 506 360 494 420 480 C468 468 514 476 552 488 L552 530 L0 530 Z" fill="#6f9183" opacity=".64"/>
      <path d="M652 490 C735 467 804 469 878 482 C960 497 1048 478 1200 463 L1200 530 L652 530 Z" fill="#779687" opacity=".57"/>
      <path d="M0 510 C120 492 192 500 274 515 C348 529 405 520 462 508 L462 541 L0 541 Z" fill="#4b716c" opacity=".55"/>
      <path d="M704 508 C798 489 866 497 948 510 C1040 525 1112 509 1200 494 L1200 544 L704 544 Z" fill="#537a70" opacity=".52"/>

      <!-- lighthouse on the point -->
      <g transform="translate(1018 432)" opacity=".7">
        <path d="M-15 59 L-8 2 L8 2 L15 59 Z" fill="#f6e7cc"/>
        <path d="M-12 15 L12 15 L14 29 L-14 29 Z" fill="#d15d4d"/>
        <path d="M-15 59 L15 59 L19 68 L-19 68 Z" fill="#395d5d"/>
        <rect x="-7" y="-10" width="14" height="13" rx="2" fill="#ffd27e"/>
        <path d="M-10 -10 L0 -22 L10 -10 Z" fill="#315257"/>
      </g>

      <!-- sea -->
      <path d="M0 523 H1200 V638 H0 Z" fill="url(#sea)"/>
      <path d="M0 523 H1200" stroke="#f6d6a3" stroke-width="2" opacity=".7"/>
      <g fill="none" stroke-linecap="round">
        <path class="wave-line" d="M58 558 H282" stroke="#d7e2d8" stroke-width="3" opacity=".44"/>
        <path class="wave-line wave-line--slow" d="M342 580 H628" stroke="#c5d9d1" stroke-width="2.4"/>
        <path class="wave-line" d="M720 551 H1010" stroke="#d7e2d8" stroke-width="3" opacity=".33"/>
        <path class="wave-line wave-line--slow" d="M876 602 H1168" stroke="#c5d9d1" stroke-width="2.4"/>
        <path class="wave-line" d="M185 612 H408" stroke="#d7e2d8" stroke-width="2.2" opacity=".28"/>
        <path d="M1020 543 C1064 548 1088 562 1124 558" stroke="#ffdfaa" stroke-width="2" opacity=".34"/>
        <path d="M1085 574 C1118 578 1142 588 1184 584" stroke="#ffdfaa" stroke-width="2" opacity=".25"/>
      </g>

      <!-- sailboat -->
      <g class="sea-plane" transform="translate(724 544)" opacity=".76">
        <path d="M-24 29 H36 L25 42 H-13 Z" fill="#203f47"/>
        <path d="M0 0 L0 29" stroke="#203f47" stroke-width="2.5"/>
        <path d="M2 2 L25 25 L2 25 Z" fill="#f7ead1"/>
        <path d="M-2 7 L-20 25 L-2 25 Z" fill="#e4cdb0"/>
        <path d="M0 0 L2 -6 L8 2 Z" fill="#d65848"/>
      </g>

      <!-- shore / promenade -->
      <path d="M0 626 C160 614 268 630 410 624 C570 617 706 604 848 617 C984 629 1090 619 1200 610 V682 H0 Z" fill="#c9a07f"/>
      <path d="M0 636 C180 625 288 641 429 632 C574 623 714 617 855 628 C992 639 1096 629 1200 622 V646 H0 Z" fill="#e0b691" opacity=".66"/>
      <path d="M0 652 H1200 V800 H0 Z" fill="url(#road)"/>
      <path d="M0 654 C160 648 268 658 432 652 C619 645 780 649 938 655 C1044 659 1122 655 1200 650" fill="none" stroke="#f2d0a7" stroke-width="4" opacity=".8"/>
      <path d="M0 706 H1200" stroke="#f0cca5" stroke-width="3" stroke-dasharray="160 80" opacity=".35"/>
      <path d="M0 758 H1200" stroke="#c58e68" stroke-width="2" opacity=".27"/>

      <!-- boardwalk seams and moving path markings -->
      <g stroke="#c68f6b" stroke-width="2" opacity=".3">
        <path d="M84 664 L78 800"/>
        <path d="M260 660 L254 800"/>
        <path d="M470 657 L478 800"/>
        <path d="M704 658 L720 800"/>
        <path d="M916 660 L936 800"/>
        <path d="M1092 657 L1118 800"/>
      </g>
      <line class="road-dashes" x1="-80" y1="719" x2="1300" y2="719" stroke="#fff1d2" stroke-width="10" stroke-linecap="round" opacity=".7"/>
      <line class="road-dashes road-dashes--far" x1="-80" y1="681" x2="1300" y2="681" stroke="#f4d1a4" stroke-width="5" stroke-linecap="round" opacity=".42"/>

      <!-- pebbles -->
      <g fill="#a86f50" opacity=".34">
        <ellipse cx="146" cy="746" rx="7" ry="3.5"/>
        <ellipse cx="326" cy="778" rx="5" ry="2.5"/>
        <ellipse cx="982" cy="741" rx="8" ry="3.8"/>
        <ellipse cx="1068" cy="780" rx="5" ry="2.4"/>
        <ellipse cx="872" cy="693" rx="4" ry="2"/>
      </g>

      <!-- speed / wind streaks -->
      <g fill="none" stroke="#fff1d7" stroke-width="4" stroke-linecap="round" opacity=".42">
        <path class="wind-line" d="M214 364 H412"/>
        <path class="wind-line wind-line--2" d="M64 414 H228"/>
        <path class="wind-line wind-line--3" d="M912 386 H1088"/>
      </g>

      <!-- foreground shadows -->
      <ellipse cx="606" cy="736" rx="245" ry="20" fill="url(#groundShadow)"/>

      <!-- ===================== BICYCLE ===================== -->
      <g id="bike">
        <!-- far crank, tucked behind the frame -->
        <g id="crankFar" transform="rotate(0 590 646)">
          <line x1="590" y1="646" x2="590" y2="682" stroke="#31474c" stroke-width="8" stroke-linecap="round"/>
          <rect x="565" y="678" width="46" height="11" rx="5.5" fill="#2b4247" stroke="#f3dfbd" stroke-width="2"/>
          <rect x="570" y="679" width="9" height="9" rx="3" fill="#e89b4c"/>
        </g>

        <!-- far leg -->
        <g id="legFar" opacity=".92">
          <path id="legFarThigh" d="M540 490 L579 563 L604 676" fill="none" stroke="#c97443" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="legFarShin" d="M579 563 L604 676" fill="none" stroke="#d98247" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle id="legFarKnee" cx="579" cy="563" r="7" fill="#c97443"/>
          <g id="footFar" transform="translate(604 676) rotate(-8)">

        <!-- wheels -->
        <g id="rearWheel" transform="translate(440 638)">
          <circle r="95" fill="none" stroke="#23383e" stroke-width="18"/>

          <circle r="83" fill="none" stroke="#f8e8c9" stroke-width="5"/>
          <circle r="77" fill="none" stroke="#d2a86f" stroke-width="1.5" opacity=".65"/>
          <g id="rearSpokes" stroke="#f6e4c2" stroke-width="2" opacity=".86"></g>
          <circle r="13" fill="#df523d"/>
          <circle r="5" fill="#f8e7c8"/>
        </g>
        <g id="frontWheel" transform="translate(780 638)">
          <circle r="95" fill="none" stroke="#23383e" stroke-width="18"/>
          <circle r="95" fill="none" stroke="#4a6266" stroke-width="2.5" stroke-dasharray="5 14" opacity=".7"/>
          <circle r="83" fill="none" stroke="#f8e8c9" stroke-width="5"/>
          <circle r="77" fill="none" stroke="#d2a86f" stroke-width="1.5" opacity=".65"/>
          <g id="frontSpokes" stroke="#f6e4c2" stroke-width="2" opacity=".86"></g>
          <circle r="13" fill="#df523d"/>
          <circle r="5" fill="#f8e7c8"/>
        </g>

        <!-- fenders -->
        <g fill="none" stroke-linecap="round">
          <path d="M362 673 A96 96 0 0 1 500 572" stroke="#f4dfbb" stroke-width="8" opacity=".96"/>
          <path d="M362 673 A96 96 0 0 1 500 572" stroke="#cfa66e" stroke-width="2" opacity=".48"/>
          <path d="M704 571 A96 96 0 0 1 851 667" stroke="#f4dfbb" stroke-width="8" opacity=".96"/>
          <path d="M704 571 A96 96 0 0 1 851 667" stroke="#cfa66e" stroke-width="2" opacity=".48"/>

  <div class="brand" aria-hidden="true">
    <div class="brand__eyebrow">Seaside route no. 07</div>
    <h1>Pelican<em>on a bicycle</em></h1>
  </div>

  <div class="stamp" aria-hidden="true">
    <span>Golden hour · 18:42</span>
    <span class="rule"></span>
    <span>Slow down &amp; enjoy the coast</span>
  </div>

  <button class="motion-toggle" id="motionToggle" type="button" aria-label="暂停动画" aria-pressed="false">
    <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="4" height="12" rx="1"/><rect x="9.5" y="2" width="4" height="12" rx="1"/></svg>
    <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6c0 .9 1 1.4 1.7.9l8-5.8a1.1 1.1 0 0 0 0-1.8l-8-5.8C5 1 4 1.4 4 2.2Z"/></svg>
  </button>

<script>
(() => {
  const svgNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  // Build the wheel spokes once, then spin the spoke groups.
  [["rearSpokes", 440], ["frontSpokes", 780]].forEach(([id]) => {
    const group = $(id);
    for (let i = 0; i < 16; i += 1) {
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", "0");
      line.setAttribute("y1", "-74");
      line.setAttribute("x2", "0");
      line.setAttribute("y2", "-15");
      line.setAttribute("transform", `rotate(${(i * 360) / 16})`);
      group.appendChild(line);
    }
  });

  const BB = { x: 590, y: 646 };
  const PEDAL_R = 38;
  const legNear = {
    hip: { x: 567, y: 496 },
    upper: 90,
    lower: 104,
    thigh: $("legNearThigh"),
    shin: $("legNearShin"),
    knee: $("legNearKnee"),
    foot: $("footNear"),
  };
  const legFar = {
    hip: { x: 537, y: 489 },
    upper: 94,
    lower: 110,
    thigh: $("legFarThigh"),
    shin: $("legFarShin"),
    knee: $("legFarKnee"),
    foot: $("footFar"),
  };

  const pelican = $("pelican");
  const head = $("head");
  const rearSpokes = $("rearSpokes");
  const frontSpokes = $("frontSpokes");
  const chainring = $("chainring");
  const crankNear = $("crankNear");
  const crankFar = $("crankFar");
  const scarfMain = $("scarfMain");
  const scarfUnder = $("scarfUnder");
  const scarfStripe = $("scarfStripe");
  const crankPedalRects = [...document.querySelectorAll("#crankNear rect, #crankFar rect")];
  const stage = document.querySelector(".stage");
  const toggle = $("motionToggle");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let paused = reduceMotion;
  let elapsed = 0;
  let last = performance.now();

  function setPaused(value) {
    paused = value;
    stage.classList.toggle("is-paused", paused);
    toggle.classList.toggle("is-paused", paused);
    toggle.setAttribute("aria-pressed", String(paused));
    toggle.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
  }

  // Two-bone IK: always choose the knee that bends forward toward the handlebars.
  function kneeFor(hip, ankle, upper, lower) {
    let dx = ankle.x - hip.x;
    let dy = ankle.y - hip.y;
    let distance = Math.hypot(dx, dy) || 0.001;
    const maxReach = upper + lower - 0.5;
    const minReach = Math.abs(upper - lower) + 0.5;
    const reach = Math.min(maxReach, Math.max(minReach, distance));
    const ux = dx / distance;
    const uy = dy / distance;
    const along = (upper * upper - lower * lower + reach * reach) / (2 * reach);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const midX = hip.x + ux * along;
    const midY = hip.y + uy * along;
    const kneeA = { x: midX - uy * height, y: midY + ux * height };
    const kneeB = { x: midX + uy * height, y: midY - ux * height };
    return kneeA.x > kneeB.x ? kneeA : kneeB;
  }

  function solveLeg(leg, pedal, bob, angle, far) {
    const ankle = { x: pedal.x + (far ? -1 : 2), y: pedal.y - 5 };
    const hip = { x: leg.hip.x, y: leg.hip.y + bob };
    const knee = kneeFor(hip, ankle, leg.upper, leg.lower);
    leg.thigh.setAttribute("d", `M ${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)}`);
    leg.shin.setAttribute("d", `M ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`);
    leg.knee.setAttribute("cx", knee.x.toFixed(2));
    leg.knee.setAttribute("cy", knee.y.toFixed(2));
    const footTilt = -7 + Math.sin(angle + (far ? Math.PI : 0)) * 2.5;
    leg.foot.setAttribute("transform", `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}) rotate(${footTilt.toFixed(2)})`);
  }

  function updateScarf(time) {
    const a = Math.sin(time * 5.1);
    const b = Math.sin(time * 5.1 + 1.1);
    const c = Math.sin(time * 5.1 + 2.2);
    const d = Math.sin(time * 5.1 + 0.55);
    const e = Math.sin(time * 5.1 + 1.7);

    scarfMain.setAttribute(
      "d",
      `M 642 306 C 602 ${(299 + a * 8).toFixed(1)} 562 ${(277 + b * 14).toFixed(1)} 516 ${(290 + c * 15).toFixed(1)} ` +
      `C 480 ${(303 + d * 11).toFixed(1)} 448 ${(292 + e * 13).toFixed(1)} 414 ${(291 + a * 15).toFixed(1)}`
    );
    scarfStripe.setAttribute("d", scarfMain.getAttribute("d"));
    scarfUnder.setAttribute(
      "d",
      `M 642 310 C 604 ${(312 + d * 7).toFixed(1)} 567 ${(295 + c * 12).toFixed(1)} 524 ${(306 + b * 13).toFixed(1)} ` +
      `C 492 ${(320 + a * 10).toFixed(1)} 458 ${(306 + d * 12).toFixed(1)} 432 ${(303 + e * 12).toFixed(1)}`
    );
  }

  function renderFrame(seconds) {
    const wheelAngle = (seconds * 560) % 360;
    const crankAngle = (seconds * 228) % 360;
    const crankRad = (crankAngle * Math.PI) / 180;
    const bob = Math.sin(seconds * 4.2) * 2.1 + Math.sin(seconds * 8.4 + 0.8) * 0.5;

    rearSpokes.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    frontSpokes.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    chainring.setAttribute("transform", `rotate(${crankAngle.toFixed(2)} 590 646)`);
    crankNear.setAttribute("transform", `rotate(${crankAngle.toFixed(2)} 590 646)`);
    crankFar.setAttribute("transform", `rotate(${(crankAngle + 180).toFixed(2)} 590 646)`);

    // Keep the pedals level while the crank arms turn.
    crankPedalRects.forEach((rect) => {
      const x = Number(rect.getAttribute("x"));
      const y = Number(rect.getAttribute("y"));
      const w = Number(rect.getAttribute("width"));
      const h = Number(rect.getAttribute("height"));
      rect.setAttribute("transform", `rotate(${(-crankAngle).toFixed(2)} ${x + w / 2} ${y + h / 2})`);
    });

    const pedalNear = {
      x: BB.x + Math.cos(crankRad) * PEDAL_R,
      y: BB.y + Math.sin(crankRad) * PEDAL_R,
    };
    const pedalFar = {
      x: BB.x + Math.cos(crankRad + Math.PI) * PEDAL_R,
      y: BB.y + Math.sin(crankRad + Math.PI) * PEDAL_R,
    };

    solveLeg(legFar, pedalFar, bob, crankRad + Math.PI, true);
    solveLeg(legNear, pedalNear, bob, crankRad, false);

    pelican.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    head.setAttribute("transform", `rotate(${(Math.sin(seconds * 2.35 + 0.6) * 0.8).toFixed(2)} 730 268)`);
    updateScarf(seconds);
  }

  function tick(now) {
    const delta = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) elapsed += delta;
    renderFrame(elapsed);
    requestAnimationFrame(tick);
  }

  toggle.addEventListener("click", () => {
    setPaused(!paused);
    last = performance.now();
  });

  // Space toggles the ride too, unless the user is focused on a control.
  window.addEventListener("keydown", (event) => {
    if (event.code !== "Space") return;
    if (event.target.closest("button, a, input, textarea, select")) return;
    event.preventDefault();
    setPaused(!paused);
    last = performance.now();
  });

  setPaused(reduceMotion);
  renderFrame(0);
  requestAnimationFrame(tick);
})();
</script>
