<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>固定支出页 · 空态 v2</title>
<style>
  :root{--bg:#fff9f2;--surface:#fff;--ink:#173b3a;--muted:#6b7f7d;--muted-light:#9aa9a6;
    --line:#dce9e5;--teal:#24b89a;--teal-dark:#087c6e;--teal-soft:#ddf7ef;
    --shadow:0 8px 24px rgb(23 59 58 / 7%), 0 2px 6px rgb(23 59 58 / 4%)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif}
  .page{width:1120px;margin:0 auto;padding:36px 0 48px}
  .head{display:flex;align-items:center;gap:18px;margin-bottom:22px}
  .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .title{font-size:28px;line-height:36px;font-weight:800;margin:0;letter-spacing:.5px}
  .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .month{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
  .caret{color:var(--muted);font-size:10px}
  .export{background:var(--teal-soft);color:var(--teal-dark);border:0;border-radius:999px;
    padding:10px 20px;font-size:14px;font-weight:700;font-family:inherit;opacity:.55}
  .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
  .empty{padding:96px 0 104px;text-align:center}
  .glyph{width:76px;height:76px;border-radius:24px;background:#f5fbf8;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;color:var(--teal-dark)}
  .glyph svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .empty h2{font-size:22px;font-weight:800;margin:0 0 10px}
  .empty p{font-size:14px;color:var(--muted);margin:0 0 26px}
  .cta{background:#0f7a6a;color:#fff;border:0;border-radius:999px;padding:13px 28px;
    font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 3px 0 #0a5f53}
  .note{margin-top:18px;font-size:11.5px;color:var(--muted-light);letter-spacing:.2px}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="back">‹</div>
    <div>
      <h1 class="title">固定支出</h1>
      <div class="subtitle">每月要付的 · 0 项</div>
    </div>
    <div class="head-right">
      <div class="month">2026 年 10 月 <span class="caret">▾</span></div>
      <button class="export">导出备份</button>
    </div>
  </div>

  <div class="card empty">
    <div class="glyph">
      <svg viewBox="0 0 24 24"><path d="M4 10.6 12 4l8 6.6V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9.6 21v-6h4.8v6"/><path d="M12 8.2v3.4M10.3 9.9h3.4"/></svg>
    </div>
    <h2>还没有固定支出</h2>
    <p>加一项，比如房租、水电</p>
    <button class="cta">添加固定支出</button>
  </div>
  <div class="note" style="margin-top:14px;text-align:left">注（设计注释，不属于界面文案）：空态不渲染摘要卡与右侧占比列；「导出备份」置灰不可点。</div>
</div>
</body>
</html>
