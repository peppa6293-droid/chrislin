<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 50%, #F0E68C 100%);
            overflow: hidden;
        }

        .animation-container {
            width: 800px;
            height: 500px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes bikeMove {
            0% {
                transform: translateX(0) translateY(0);
            }
            50% {
                transform: translateX(200px) translateY(-20px);
            }
            100% {
                transform: translateX(400px) translateY(0);
            }
        }

        @keyframes wheelSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pelicanWings {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-15deg);
            }
            75% {
                transform: rotate(15deg);
            }
        }

        @keyframes pelicanHead {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(10deg);
            }
        }

        @keyframes cloudMove {
            0% {
                transform: translateX(-100px);
            }
            100% {
                transform: translateX(900px);
            }
        }

        .bike-group {
            animation: bikeMove 8s ease-in-out infinite;
            transform-origin: 200px 300px;
        }

        .wheel {
            animation: wheelSpin 2s linear infinite;
            transform-origin: center;
        }

        .wheel-back {
            animation: wheelSpin 2s linear infinite;
            transform-origin: center;
        }

        .pelican-body {
            animation: bikeMove 8s ease-in-out infinite;
        }

        .pelican-wing {
            animation: pelicanWings 1.5s ease-in-out infinite;
            transform-origin: 280px 220px;
        }

        .pelican-wing-right {
            animation: pelicanWings 1.5s ease-in-out infinite reverse;
            transform-origin: 320px 220px;
        }

        .pelican-head {
            animation: pelicanHead 3s ease-in-out infinite, bikeMove 8s ease-in-out infinite;
            transform-origin: 300px 190px;
        }

        .cloud {
            animation: cloudMove 20s linear infinite;
        }

        .cloud2 {
            animation: cloudMove 25s linear infinite reverse;
        }

        .ground {
            fill: #8B4513;
        }

        .road {
            fill: #696969;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="url(#skyGradient)" />

            <!-- 太阳 -->
            <circle cx="700" cy="100" r="40" fill="#FFD700" />
            <circle cx="700" cy="100" r="50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3">
                <animate attributeName="r" values="50;55;50" dur="3s" repeatCount="indefinite" />
            </circle>

            <!-- 云朵 -->
            <g class="cloud">
                <ellipse cx="50" cy="80" rx="40" ry="20" fill="white" opacity="0.9" />
                <ellipse cx="80" cy="70" rx="50" ry="25" fill="white" opacity="0.9" />
                <ellipse cx="120" cy="80" rx="40" ry="20" fill="white" opacity="0.9" />
                <ellipse cx="100" cy="90" rx="35" ry="15" fill="white" opacity="0.9" />
            </g>

            <g class="cloud2" transform="translate(0, 150)">
                <ellipse cx="600" cy="80" rx="35" ry="18" fill="white" opacity="0.9" />
                <ellipse cx="640" cy="70" rx="45" ry="22" fill="white" opacity="0.9" />
                <ellipse cx="680" cy="80" rx="35" ry="18" fill="white" opacity="0.9" />
            </g>

            <!-- 地面 -->
            <rect x="0" y="350" width="800" height="150" class="ground" />

            <!-- 道路 -->
            <rect x="0" y="380" width="800" height="120" class="road" rx="10" />
            <rect x="100" y="420" width="80" height="20" fill="white" opacity="0.3" />
            <rect x="250" y="420" width="80" height="20" fill="white" opacity="0.3" />
            <rect x="400" y="420" width="80" height="20" fill="white" opacity="0.3" />
            <rect x="550" y="420" width="80" height="20" fill="white" opacity="0.3" />

            <!-- 自行车和鹈鹕组 -->
            <g class="bike-group" transform="translate(50, 200)">

                <!-- 自行车 -->
                <!-- 后轮 -->
                <g class="wheel-back" transform="translate(100, 200)">
                    <circle cx="0" cy="0" r="40" fill="#222" stroke="#333" stroke-width="3" />
                    <circle cx="0" cy="0" r="10" fill="#444" />
                    <!-- 轮辐 -->
                    <g stroke="#555" stroke-width="2">
                        <line x1="0" y1="-35" x2="0" y2="-10" />
                        <line x1="0" y1="10" x2="0" y2="35" />
                        <line x1="-35" y1="0" x2="-10" y2="0" />
                        <line x1="10" y1="0" x2="35" y2="0" />
                        <line x1="-25" y1="-25" x2="-7" y2="-7" />
                        <line x1="7" y1="7" x2="25" y2="25" />
                        <line x1="-25" y1="25" x2="-7" y2="7" />
                        <line x1="7" y1="-7" x2="25" y2="-25" />
                    </g>
                </g>

                <!-- 前轮 -->
                <g class="wheel" transform="translate(250, 200)">
                    <circle cx="0" cy="0" r="35" fill="#222" stroke="#333" stroke-width="3" />
                    <circle cx="0" cy="0" r="8" fill="#444" />
                    <!-- 轮辐 -->
                    <g stroke="#555" stroke-width="2">
                        <line x1="0" y1="-30" x2="0" y2="-8" />
                        <line x1="0" y1="8" x2="0" y2="30" />
                        <line x1="-30" y1="0" x2="-8" y2="0" />
                        <line x1="8" y1="0" x2="30" y2="0" />
                        <line x1="-22" y1="-22" x2="-6" y2="-6" />
                        <line x1="6" y1="6" x2="22" y2="22" />
                        <line x1="-22" y1="22" x2="-6" y2="6" />
                        <line x1="6" y1="-6" x2="22" y2="-22" />
                    </g>
                </g>

                <!-- 车架 -->
                <path d="M100 160 L180 140 L220 160 L250 180" stroke="#444" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

                <!-- 车把 -->
                <path d="M180 140 L170 100 L195 95 L205 110" stroke="#444" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="170" cy="100" r="4" fill="#444" />
                <circle cx="205" cy="110" r="4" fill="#444" />

                <!-- 踏板 -->
                <circle cx="160" cy="220" r="8" fill="#444" />
                <circle cx="200" cy="220" r="8" fill="#444" />
                <line x1="160" y1="220" x2="140" y2="200" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <line x1="200" y1="220" x2="220" y2="200" stroke="#444" stroke-width="4" stroke-linecap="round" />

                <!-- 链条 -->
                <path d="M140 190 L145 185 L150 190 L155 185 L160 190" stroke="#555" stroke-width="2" fill="none" />
                <path d="M200 190 L205 185 L210 190 L215 185 L220 190" stroke="#555" stroke-width="2" fill="none" />

                <!-- 鹈鹕 -->
                <!-- 身体 -->
                <ellipse cx="200" cy="140" rx="45" ry="35" fill="white" stroke="#333" stroke-width="2" class="pelican-body" />

                <!-- 翅膀 -->
                <path d="M155 140 Q120 120 100 130 Q90 140 100 150 Q120 160 155 140" fill="white" stroke="#333" stroke-width="2" class="pelican-wing" />
                <path d="M245 140 Q280 120 310 130 Q320 140 310 150 Q280 160 245 140" fill="white" stroke="#333" stroke-width="2" class="pelican-wing-right" />

                <!-- 头部 -->
                <ellipse cx="290" cy="120" rx="25" ry="20" fill="white" stroke="#333" stroke-width="2" class="pelican-head" />

                <!-- 嘴巴 -->
                <path d="M315 120 L360 110 L365 125 L315 130 Z" fill="#FFA500" stroke="#CC8400" stroke-width="2" class="pelican-head" />
                <line x1="360" y1="110" x2="365" y2="125" stroke="#995500" stroke-width="1" />

                <!-- 眼睛 -->
                <circle cx="280" cy="115" r="5" fill="white" stroke="#333" stroke-width="1" />
                <circle cx="280" cy="115" r="2" fill="#333" />

                <!-- 腿 -->
                <line x1="180" y1="175" x2="180" y2="210" stroke="#FFA500" stroke-width="6" stroke-linecap="round" />
                <line x1="220" y1="175" x2="220" y2="210" stroke="#FFA500" stroke-width="6" stroke-linecap="round" />

                <!-- 趾 -->
                <line x1="175" y1="210" x2="185" y2="210" stroke="#FFA500" stroke-width="3" stroke-linecap="round" />
                <line x1="215" y1="210" x2="225" y2="210" stroke="#FFA500" stroke-width="3" stroke-linecap="round" />

                <!-- 尾部羽毛 -->
                <path d="M155 140 Q140 145 135 155 Q140 165 155 160" fill="white" stroke="#333" stroke-width="1" />

            </g>

            <!-- 树木装饰 -->
            <rect x="650" y="300" width="20" height="80" fill="#8B4513" />
            <circle cx="660" cy="280" r="30" fill="#228B22" />
            <circle cx="645" cy="270" r="25" fill="#32CD32" />
            <circle cx="675" cy="270" r="25" fill="#32CD32" />

            <!-- 天空渐变 -->
            <defs>
                <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#98FB98;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1" />
                </linearGradient>
            </defs>

        </svg>
    </div>
</body>
</html>
